<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 지도</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    .app { display: flex; position: relative; width: 100%; height: 800px; min-height: 800px; background: #fff; }
    .sidebar { width: 320px; min-width: 320px; height: 100%; overflow-y: auto; border-right: 1px solid #e5e7eb; background: #fff; z-index: 2; transition: width .25s ease, min-width .25s ease, border-width .25s ease; }
    .app.sidebar-collapsed .sidebar { width: 0; min-width: 0; overflow: hidden; border-right-width: 0; }
    .sidebar-header { padding: 22px 20px 16px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
    .sidebar-header h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.3; }
    .sidebar-header p { margin: 0; color: #6b7280; font-size: 13px; }
    .filters { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
    .filter-btn { flex: 0 0 auto; padding: 7px 12px; border: 1px solid #e5e7eb; border-radius: 999px; background: #fff; font-size: 12px; cursor: pointer; }
    .filter-btn:hover { background: #f5f5f5; }
    .filter-btn.active { border-color: #111827; background: #111827; color: #fff; }
    .place-group { padding: 14px 10px 4px; }
    .group-title { padding: 4px 10px 8px; color: #374151; font-size: 13px; font-weight: 700; }
    .place-card { display: block; width: 100%; padding: 12px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
    .place-card:hover { background: #f5f6f7; }
    .place-name { display: block; margin-bottom: 4px; color: #111827; font-size: 14px; font-weight: 600; }
    .place-description { display: block; color: #6b7280; font-size: 12px; line-height: 1.45; }
    .empty-message { padding: 24px 20px; color: #6b7280; font-size: 13px; line-height: 1.6; }
    .map-area { position: relative; flex: 1; min-width: 0; height: 800px; }
    #map { width: 100%; height: 100%; }
    .sidebar-toggle { position: absolute; top: 16px; left: 320px; z-index: 10; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; border: 1px solid #e5e7eb; border-radius: 8px; background: rgba(255,255,255,.96); color: #374151; font-size: 16px; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.12); transition: left .25s ease, background .15s ease; }
    .sidebar-toggle:hover { background: #f5f5f5; }
    .app.sidebar-collapsed .sidebar-toggle { left: 12px; }
    .error { display: none; position: fixed; top: 20px; left: 50%; z-index: 9999; max-width: calc(100% - 40px); padding: 12px 16px; border-radius: 10px; background: #111827; color: #fff; font-size: 13px; line-height: 1.5; transform: translateX(-50%); }
    @media (max-width: 700px) { .sidebar { width: 260px; min-width: 260px; } .sidebar-toggle { left: 260px; } .app.sidebar-collapsed .sidebar-toggle { left: 12px; } .sidebar-header h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 id="tripTitle">📍 제주 여행</h1>
        <p>가보고 싶은 장소를 한눈에 확인하세요.</p>
      </div>
      <div class="filters" id="filters"></div>
      <div id="placeList"><div class="empty-message">장소 데이터를 불러오는 중입니다.</div></div>
    </aside>
    <main class="map-area"><div id="map"></div></main>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="장소 목록 접기" aria-expanded="true" aria-controls="sidebar" title="장소 목록 접기">◀</button>
  </div>
  <div id="error" class="error"></div>

  <script>
    const API_KEY = "AIzaSyAc7LDz8BDJDlX54sWnhMteaoEf_4KpOKg";
    const SPREADSHEET_ID = "1GDJjIVz-5GG11zi7cQOvqy8FzL04TwVSUsghK0sR6d0";

    const query = new URLSearchParams(window.location.search);
    const SHEET_NAME = query.get("sheet") || "제주";

    let map = null;
    let infoWindow = null;
    let activeCategory = "전체";
    let places = [];
    const markers = new Map();

    const app = document.getElementById("app");
    const filters = document.getElementById("filters");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const placeList = document.getElementById("placeList");
    document.getElementById("tripTitle").textContent = "📍 " + SHEET_NAME + " 여행";
    document.title = SHEET_NAME + " 여행 지도";

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    function escapeHtml(text) {
      const element = document.createElement("div");
      element.textContent = String(text || "");
      return element.innerHTML;
    }

    function extractCoordinates(mapUrl) {
      if (!mapUrl) return null;
      let decodedUrl = String(mapUrl);
      try { decodedUrl = decodeURIComponent(decodedUrl); } catch (error) { console.warn("지도 URL 디코딩 실패:", error); }
      const match = decodedUrl.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/i);
      if (!match) return null;
      const lat = Number(match[1]);
      const lng = Number(match[2]);
      return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
    }

    function requestSheetData(sheetName) {
      return new Promise(function (resolve, reject) {
        const callbackName = "sheetDataCallback_" + Date.now();
        const script = document.createElement("script");
        const timeout = window.setTimeout(function () {
          cleanup();
          reject(new Error("Google Sheets 응답 시간이 초과되었습니다."));
        }, 15000);

        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = function (data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function () {
          cleanup();
          reject(new Error("Google Sheets 데이터를 불러오지 못했습니다."));
        };

        const params = new URLSearchParams({
          sheet: sheetName,
          tqx: "out:json;responseHandler:" + callbackName
        });

        script.src = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?" + params.toString();
        document.head.appendChild(script);
      });
    }

    function clearMarkers() {
      markers.forEach(function (marker) { marker.setMap(null); });
      markers.clear();
    }

    function openPlace(place) {
      const marker = markers.get(place.id);
      if (!map || !marker) return;
      map.panTo({ lat: place.lat, lng: place.lng });
      map.setZoom(15);

      infoWindow.setContent(`
        <div style="padding:4px 6px; max-width:220px;">
          <div style="margin-bottom:5px; color:#6b7280; font-size:12px;">${escapeHtml(place.category)}</div>
          <div style="margin-bottom:5px; font-size:16px; font-weight:700;">${escapeHtml(place.name)}</div>
          <div style="color:#6b7280; font-size:12px; line-height:1.5;">${escapeHtml(place.description)}</div>
          <a href="${escapeHtml(place.mapUrl)}" target="_blank" rel="noopener noreferrer" style="display:inline-block; margin-top:8px; color:#2563eb; font-size:12px;">Google Maps에서 보기</a>
        </div>
      `);
      infoWindow.open({ map: map, anchor: marker });
    }

    function createMarkers() {
      if (!map) return;
      clearMarkers();
      places.forEach(function (place) {
        const marker = new google.maps.Marker({ map: map, position: { lat: place.lat, lng: place.lng }, title: place.name });
        marker.addListener("click", function () { openPlace(place); });
        markers.set(place.id, marker);
      });
      applyMarkerVisibility();
    }

    function getCategories() {
      return [...new Set(places.map(function (place) { return place.category; }).filter(Boolean))];
    }

    function renderFilters() {
      const categories = ["전체", ...getCategories()];
      if (!categories.includes(activeCategory)) activeCategory = "전체";
      filters.innerHTML = categories.map(function (category) {
        return `<button type="button" class="filter-btn${category === activeCategory ? " active" : ""}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`;
      }).join("");
      document.querySelectorAll(".filter-btn").forEach(function (button) {
        button.addEventListener("click", function () { applyFilter(button.dataset.category); });
      });
    }

    function renderPlaceList() {
      const visiblePlaces = places.filter(function (place) { return activeCategory === "전체" || place.category === activeCategory; });
      const categories = activeCategory === "전체" ? getCategories() : [activeCategory];
      if (visiblePlaces.length === 0) {
        placeList.innerHTML = '<div class="empty-message">표시할 장소가 없습니다.</div>';
        return;
      }
      placeList.innerHTML = categories.map(function (category) {
        const categoryPlaces = visiblePlaces.filter(function (place) { return place.category === category; });
        if (categoryPlaces.length === 0) return "";
        return `<section class="place-group"><div class="group-title">${escapeHtml(category)}</div>${categoryPlaces.map(function (place) {
          return `<button type="button" class="place-card" data-place-id="${place.id}"><span class="place-name">${escapeHtml(place.name)}</span><span class="place-description">${escapeHtml(place.description)}</span></button>`;
        }).join("")}</section>`;
      }).join("");
      document.querySelectorAll(".place-card").forEach(function (card) {
        card.addEventListener("click", function () {
          const place = places.find(function (item) { return item.id === Number(card.dataset.placeId); });
          if (place) openPlace(place);
        });
      });
    }

    function applyMarkerVisibility() {
      markers.forEach(function (marker, placeId) {
        const place = places.find(function (item) { return item.id === placeId; });
        if (place) marker.setVisible(activeCategory === "전체" || place.category === activeCategory);
      });
    }

    function applyFilter(category) {
      activeCategory = category;
      renderFilters();
      applyMarkerVisibility();
      if (infoWindow) infoWindow.close();
      renderPlaceList();
    }

    function fitMapToPlaces() {
      if (!map || places.length === 0) return;
      if (places.length === 1) {
        map.setCenter({ lat: places[0].lat, lng: places[0].lng });
        map.setZoom(14);
        return;
      }
      const bounds = new google.maps.LatLngBounds();
      places.forEach(function (place) { bounds.extend({ lat: place.lat, lng: place.lng }); });
      map.fitBounds(bounds, 50);
    }

    async function loadPlacesFromSheet() {
      try {
        const data = await requestSheetData(SHEET_NAME);
        if (data.status === "error") throw new Error("'" + SHEET_NAME + "' 탭을 찾지 못했습니다.");
        let columns = data.table.cols.map(function (column) { return String(column.label || "").trim().toLowerCase(); });
        const requiredColumns = ["name", "category", "map_url", "description"];
        let dataRows = data.table.rows || [];

        // Google Sheets가 첫 행을 열 이름으로 전달하지 않는 경우를 처리합니다.
        // 이 경우 첫 번째 데이터 행에서 name/category/map_url/description을 읽습니다.
        if (!requiredColumns.every(function (column) { return columns.includes(column); }) && dataRows.length > 0) {
          const firstRow = dataRows[0];
          const firstRowHeaders = (firstRow.c || []).map(function (cell) {
            return cell ? String(cell.f ?? cell.v ?? "").trim().toLowerCase() : "";
          });

          if (requiredColumns.every(function (column) { return firstRowHeaders.includes(column); })) {
            columns = firstRowHeaders;
            dataRows = dataRows.slice(1);
          }
        }

        const missingColumns = requiredColumns.filter(function (column) { return !columns.includes(column); });
        if (missingColumns.length > 0) throw new Error("시트에 필요한 열이 없습니다: " + missingColumns.join(", "));

        const invalidPlaceNames = [];
        places = dataRows.map(function (row, index) {
          const values = {};
          columns.forEach(function (columnName, columnIndex) {
            const cell = row.c[columnIndex];
            values[columnName] = cell ? String(cell.f ?? cell.v ?? "").trim() : "";
          });
          if (!values.name || !values.category || !values.map_url) return null;
          const coordinates = extractCoordinates(values.map_url);
          if (!coordinates) {
            invalidPlaceNames.push(values.name);
            return null;
          }
          return { id: index + 1, name: values.name, category: values.category, mapUrl: values.map_url, description: values.description, lat: coordinates.lat, lng: coordinates.lng };
        }).filter(Boolean);

        createMarkers();
        renderFilters();
        renderPlaceList();
        fitMapToPlaces();

        if (invalidPlaceNames.length > 0) {
          showError("좌표를 찾지 못한 장소는 제외되었습니다: " + invalidPlaceNames.join(", "));
        }
      } catch (error) {
        console.error("Google Sheets 로딩 오류:", error);
        placeList.innerHTML = '<div class="empty-message">장소 데이터를 불러오지 못했습니다.</div>';
        showError(error.message || "Google Sheets 데이터를 불러오는 중 오류가 발생했습니다.");
      }
    }

    sidebarToggle.addEventListener("click", function () {
      const isCollapsed = app.classList.toggle("sidebar-collapsed");
      sidebarToggle.textContent = isCollapsed ? "▶" : "◀";
      sidebarToggle.setAttribute("aria-label", isCollapsed ? "장소 목록 펼치기" : "장소 목록 접기");
      sidebarToggle.setAttribute("title", isCollapsed ? "장소 목록 펼치기" : "장소 목록 접기");
      sidebarToggle.setAttribute("aria-expanded", String(!isCollapsed));
      window.setTimeout(function () {
        if (map && window.google && google.maps) google.maps.event.trigger(map, "resize");
      }, 280);
    });

    window.initMap = function () {
      if (map) return;
      try {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 33.3617, lng: 126.5292 },
          zoom: 10,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: true
        });
        infoWindow = new google.maps.InfoWindow();
        loadPlacesFromSheet();
      } catch (error) {
        console.error("Google Maps 초기화 오류:", error);
        showError("Google 지도를 불러오는 중 오류가 발생했습니다.");
      }
    };

    window.gm_authFailure = function () { showError("Google Maps API 인증에 실패했습니다."); };

    if (!API_KEY.trim()) {
      showError("Google Maps API 키가 비어 있습니다.");
    } else {
      const googleMapsScript = document.createElement("script");
      googleMapsScript.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(API_KEY) + "&callback=initMap&loading=async";
      googleMapsScript.async = true;
      googleMapsScript.onerror = function () { showError("Google Maps API를 불러오지 못했습니다."); };
      document.head.appendChild(googleMapsScript);
    }
  </script>
</body>
</html>
