<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 여행 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    .app {
      display: flex;
      position: relative;
      width: 100%;
      height: 800px;
      min-height: 800px;
      background: #fff;
    }

    .sidebar {
      width: 320px;
      min-width: 320px;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid #e5e7eb;
      background: #fff;
      z-index: 2;
      transition:
        width 0.25s ease,
        min-width 0.25s ease,
        border-width 0.25s ease;
    }

    .app.sidebar-collapsed .sidebar {
      width: 0;
      min-width: 0;
      overflow: hidden;
      border-right-width: 0;
    }

    .sidebar-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    .sidebar-header h1 {
      margin: 0 0 6px;
      font-size: 21px;
      line-height: 1.3;
    }

    .sidebar-header p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    .filter-btn {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn:hover {
      background: #f5f5f5;
    }

    .filter-btn.active {
      border-color: #111827;
      background: #111827;
      color: #fff;
    }

    .place-group {
      padding: 14px 10px 4px;
    }

    .group-title {
      padding: 4px 10px 8px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .place-card {
      display: block;
      width: 100%;
      padding: 12px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .place-card:hover {
      background: #f5f6f7;
    }

    .place-name {
      display: block;
      margin-bottom: 4px;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
    }

    .place-description {
      display: block;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.45;
    }

    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 800px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .sidebar-toggle {
      position: absolute;
      top: 16px;
      left: 320px;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;
      padding: 0;

      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      color: #374151;

      font-size: 16px;
      line-height: 1;
      cursor: pointer;

      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transition:
        left 0.25s ease,
        background 0.15s ease;
    }

    .sidebar-toggle:hover {
      background: #f5f5f5;
    }

    .app.sidebar-collapsed .sidebar-toggle {
      left: 12px;
    }

    .error {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      z-index: 9999;

      max-width: calc(100% - 40px);
      padding: 12px 16px;

      border-radius: 10px;
      background: #111827;
      color: #fff;

      font-size: 13px;
      line-height: 1.5;
      transform: translateX(-50%);
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 260px;
        min-width: 260px;
      }

      .sidebar-toggle {
        left: 260px;
      }

      .app.sidebar-collapsed .sidebar-toggle {
        left: 12px;
      }

      .sidebar-header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>📍 제주 여행</h1>
        <p>가보고 싶은 장소를 한눈에 확인하세요.</p>
      </div>

      <div class="filters">
        <button type="button" class="filter-btn active" data-category="전체">
          전체
        </button>

        <button type="button" class="filter-btn" data-category="맛집">
          🍜 맛집
        </button>

        <button type="button" class="filter-btn" data-category="카페">
          ☕ 카페
        </button>

        <button type="button" class="filter-btn" data-category="관광지">
          🏖️ 관광지
        </button>
      </div>

      <div id="placeList"></div>
    </aside>

    <main class="map-area">
      <div id="map"></div>
    </main>

    <button
      type="button"
      class="sidebar-toggle"
      id="sidebarToggle"
      aria-label="장소 목록 접기"
      aria-expanded="true"
      aria-controls="sidebar"
      title="장소 목록 접기"
    >
      ◀
    </button>
  </div>

  <div id="error" class="error"></div>

  <script>
    const API_KEY = "AIzaSyAc7LDz8BDJDlX54sWnhMteaoEf_4KpOKg";

    const places = [
      {
        id: 1,
        name: "우진해장국",
        category: "맛집",
        lat: 33.4989,
        lng: 126.5149,
        description: "제주식 고사리 해장국"
      },
      {
        id: 2,
        name: "오는정김밥",
        category: "맛집",
        lat: 33.2508,
        lng: 126.5636,
        description: "서귀포 대표 김밥 맛집"
      },
      {
        id: 3,
        name: "카페 델문도",
        category: "카페",
        lat: 33.5563,
        lng: 126.7958,
        description: "함덕 해변을 바라보는 카페"
      },
      {
        id: 4,
        name: "오설록 티 뮤지엄",
        category: "관광지",
        lat: 33.3059,
        lng: 126.2896,
        description: "녹차밭과 티 뮤지엄"
      },
      {
        id: 5,
        name: "성산일출봉",
        category: "관광지",
        lat: 33.4581,
        lng: 126.9426,
        description: "제주의 대표적인 일출 명소"
      },
      {
        id: 6,
        name: "협재해수욕장",
        category: "관광지",
        lat: 33.3943,
        lng: 126.2396,
        description: "에메랄드빛 바다와 비양도"
      }
    ];

    let map = null;
    let infoWindow = null;
    let activeCategory = "전체";

    const markers = new Map();

    const app = document.getElementById("app");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const placeList = document.getElementById("placeList");

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    function escapeHtml(text) {
      const element = document.createElement("div");
      element.textContent = text;
      return element.innerHTML;
    }

    function openPlace(place) {
      const marker = markers.get(place.id);

      if (!map || !marker) {
        return;
      }

      map.panTo({
        lat: place.lat,
        lng: place.lng
      });

      map.setZoom(15);

      infoWindow.setContent(`
        <div style="padding:4px 6px; max-width:220px;">
          <div style="margin-bottom:5px; color:#6b7280; font-size:12px;">
            ${escapeHtml(place.category)}
          </div>

          <div style="margin-bottom:5px; font-size:16px; font-weight:700;">
            ${escapeHtml(place.name)}
          </div>

          <div style="color:#6b7280; font-size:12px; line-height:1.5;">
            ${escapeHtml(place.description)}
          </div>
        </div>
      `);

      infoWindow.open({
        map: map,
        anchor: marker
      });
    }

    function createMarkers() {
      places.forEach(function (place) {
        const marker = new google.maps.Marker({
          map: map,
          position: {
            lat: place.lat,
            lng: place.lng
          },
          title: place.name
        });

        marker.addListener("click", function () {
          openPlace(place);
        });

        markers.set(place.id, marker);
      });
    }

    function renderPlaceList() {
      const visiblePlaces = places.filter(function (place) {
        return activeCategory === "전체" || place.category === activeCategory;
      });

      const categories = ["맛집", "카페", "관광지"];

      placeList.innerHTML = categories
        .map(function (category) {
          const categoryPlaces = visiblePlaces.filter(function (place) {
            return place.category === category;
          });

          if (categoryPlaces.length === 0) {
            return "";
          }

          return `
            <section class="place-group">
              <div class="group-title">${category}</div>

              ${categoryPlaces
                .map(function (place) {
                  return `
                    <button
                      type="button"
                      class="place-card"
                      data-place-id="${place.id}"
                    >
                      <span class="place-name">${escapeHtml(place.name)}</span>
                      <span class="place-description">
                        ${escapeHtml(place.description)}
                      </span>
                    </button>
                  `;
                })
                .join("")}
            </section>
          `;
        })
        .join("");

      document.querySelectorAll(".place-card").forEach(function (card) {
        card.addEventListener("click", function () {
          const placeId = Number(card.dataset.placeId);
          const place = places.find(function (item) {
            return item.id === placeId;
          });

          if (place) {
            openPlace(place);
          }
        });
      });
    }

    function applyFilter(category) {
      activeCategory = category;

      document.querySelectorAll(".filter-btn").forEach(function (button) {
        button.classList.toggle(
          "active",
          button.dataset.category === activeCategory
        );
      });

      markers.forEach(function (marker, placeId) {
        const place = places.find(function (item) {
          return item.id === placeId;
        });

        marker.setVisible(
          activeCategory === "전체" || place.category === activeCategory
        );
      });

      infoWindow.close();
      renderPlaceList();
    }

    document.querySelectorAll(".filter-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        applyFilter(button.dataset.category);
      });
    });

    sidebarToggle.addEventListener("click", function () {
      const isCollapsed = app.classList.toggle("sidebar-collapsed");

      sidebarToggle.textContent = isCollapsed ? "▶" : "◀";
      sidebarToggle.setAttribute(
        "aria-label",
        isCollapsed ? "장소 목록 펼치기" : "장소 목록 접기"
      );
      sidebarToggle.setAttribute(
        "title",
        isCollapsed ? "장소 목록 펼치기" : "장소 목록 접기"
      );
      sidebarToggle.setAttribute(
        "aria-expanded",
        String(!isCollapsed)
      );

      window.setTimeout(function () {
        if (map && window.google && google.maps) {
          google.maps.event.trigger(map, "resize");
        }
      }, 280);
    });

    window.initMap = function () {
      if (map) {
        return;
      }

      try {
        map = new google.maps.Map(document.getElementById("map"), {
          center: {
            lat: 33.3617,
            lng: 126.5292
          },
          zoom: 10,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: true
        });

        infoWindow = new google.maps.InfoWindow();

        createMarkers();
        renderPlaceList();
      } catch (error) {
        console.error("Google Maps 초기화 오류:", error);
        showError("Google 지도를 불러오는 중 오류가 발생했습니다.");
      }
    };

    window.gm_authFailure = function () {
      showError("Google Maps API 인증에 실패했습니다.");
    };

    if (!API_KEY.trim()) {
      showError("Google Maps API 키가 비어 있습니다.");
    } else {
      const googleMapsScript = document.createElement("script");

      googleMapsScript.src =
        "https://maps.googleapis.com/maps/api/js" +
        "?key=" + encodeURIComponent(API_KEY) +
        "&callback=initMap" +
        "&loading=async";

      googleMapsScript.async = true;
      googleMapsScript.onerror = function () {
        showError("Google Maps API를 불러오지 못했습니다.");
      };

      document.head.appendChild(googleMapsScript);
    }
  </script>
</body>
</html>
