<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 여행 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    .app {
      display: flex;
      position: relative;
      width: 100%;
      height: 800px;
      min-height: 800px;
      background: #fff;
    }

    .sidebar {
      width: 320px;
      min-width: 320px;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid #e5e7eb;
      background: #fff;
      z-index: 2;
      transition:
        width 0.25s ease,
        min-width 0.25s ease,
        border-width 0.25s ease;
    }

    .app.sidebar-collapsed .sidebar {
      width: 0;
      min-width: 0;
      overflow: hidden;
      border-right-width: 0;
    }

    .sidebar-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    .sidebar-header h1 {
      margin: 0 0 6px;
      font-size: 21px;
      line-height: 1.3;
    }

    .sidebar-header p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    .filter-btn {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn:hover {
      background: #f5f5f5;
    }

    .filter-btn.active {
      border-color: #111827;
      background: #111827;
      color: #fff;
    }

    .place-group {
      padding: 14px 10px 4px;
    }

    .group-title {
      padding: 4px 10px 8px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .place-card {
      display: block;
      width: 100%;
      padding: 12px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .place-card:hover {
      background: #f5f6f7;
    }

    .place-name {
      display: block;
      margin-bottom: 4px;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
    }

    .place-description {
      display: block;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.45;
    }

    .empty-message {
      padding: 24px 20px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 800px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .sidebar-toggle {
      position: absolute;
      top: 16px;
      left: 320px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      color: #374151;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transition:
        left 0.25s ease,
        background 0.15s ease;
    }

    .sidebar-toggle:hover {
      background: #f5f5f5;
    }

    .app.sidebar-collapsed .sidebar-toggle {
      left: 12px;
    }

    .error {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      z-index: 9999;
      max-width: calc(100% - 40px);
      padding: 12px 16px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
      transform: translateX(-50%);
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 260px;
        min-width: 260px;
      }

      .sidebar-toggle {
        left: 260px;
      }

      .app.sidebar-collapsed .sidebar-toggle {
        left: 12px;
      }

      .sidebar-header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>📍 제주 여행</h1>
        <p>가보고 싶은 장소를 한눈에 확인하세요.</p>
      </div>

      <div class="filters" id="filters"></div>

      <div id="placeList">
        <div class="empty-message">장소 데이터를 불러오는 중입니다.</div>
      </div>
    </aside>

    <main class="map-area">
      <div id="map"></div>
    </main>

    <button
      type="button"
      class="sidebar-toggle"
      id="sidebarToggle"
      aria-label="장소 목록 접기"
      aria-expanded="true"
      aria-controls="sidebar"
      title="장소 목록 접기"
    >
      ◀
    </button>
  </div>

  <div id="error" class="error"></div>

  <script>
    const API_KEY = "AIzaSyAc7LDz8BDJDlX54sWnhMteaoEf_4KpOKg";

    const SHEET_PUBLISHED_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTV42gUy0M-Izs4DambP-sjdPXb-vhC_xxbHdVp0yw9VmJ4wBaCjgsHHW1AYSghYe4XsI4DXBCxgpQ/pubhtml";

    const SHEET_NAME = "제주";

    let map = null;
    let infoWindow = null;
    let activeCategory = "전체";
    let places = [];

    const markers = new Map();

    const app = document.getElementById("app");
    const filters = document.getElementById("filters");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const placeList = document.getElementById("placeList");

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    function escapeHtml(text) {
      const element = document.createElement("div");
      element.textContent = String(text || "");
      return element.innerHTML;
    }

    function getSheetDataUrl() {
      return (
        SHEET_PUBLISHED_URL.replace(/\/pubhtml.*$/, "") +
        "/gviz/tq?sheet=" +
        encodeURIComponent(SHEET_NAME)
      );
    }

    function getCellValue(cell) {
      if (!cell) {
        return "";
      }

      return cell.f ?? cell.v ?? "";
    }

    function extractCoordinates(mapUrl) {
      if (!mapUrl) {
        return null;
      }

      let decodedUrl = String(mapUrl);

      try {
        decodedUrl = decodeURIComponent(decodedUrl);
      } catch (error) {
        console.warn("지도 URL 디코딩 실패:", error);
      }

      const match = decodedUrl.match(
        /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/i
      );

      if (!match) {
        return null;
      }

      const lat = Number(match[1]);
      const lng = Number(match[2]);

      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        return null;
      }

      return { lat, lng };
    }

    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers.clear();
    }

    function openPlace(place) {
      const marker = markers.get(place.id);

      if (!map || !marker) {
        return;
      }

      map.panTo({
        lat: place.lat,
        lng: place.lng
      });

      map.setZoom(15);

      const mapLink = place.mapUrl
        ? `
          <a
            href="${escapeHtml(place.mapUrl)}"
            target="_blank"
            rel="noopener noreferrer"
            style="display:inline-block; margin-top:8px; color:#2563eb; font-size:12px;"
          >
            Google Maps에서 보기
          </a>
        `
        : "";

      infoWindow.setContent(`
        <div style="padding:4px 6px; max-width:220px;">
          <div style="margin-bottom:5px; color:#6b7280; font-size:12px;">
            ${escapeHtml(place.category)}
          </div>
          <div style="margin-bottom:5px; font-size:16px; font-weight:700;">
            ${escapeHtml(place.name)}
          </div>
          <div style="color:#6b7280; font-size:12px; line-height:1.5;">
            ${escapeHtml(place.description)}
          </div>
          ${mapLink}
        </div>
      `);

      infoWindow.open({
        map: map,
        anchor: marker
      });
    }

    function createMarkers() {
      if (!map) {
        return;
      }

      clearMarkers();

      places.forEach(function (place) {
        const marker = new google.maps.Marker({
          map: map,
          position: {
            lat: place.lat,
            lng: place.lng
          },
          title: place.name
        });

        marker.addListener("click", function () {
          openPlace(place);
        });

        markers.set(place.id, marker);
      });

      applyMarkerVisibility();
    }

    function getCategories() {
      return [
        ...new Set(
          places
            .map(function (place) {
              return place.category;
            })
            .filter(Boolean)
        )
      ];
    }

    function renderFilters() {
      const categories = ["전체", ...getCategories()];

      if (!categories.includes(activeCategory)) {
        activeCategory = "전체";
      }

      filters.innerHTML = categories
        .map(function (category) {
          const isActive = category === activeCategory;

          return `
            <button
              type="button"
              class="filter-btn${isActive ? " active" : ""}"
              data-category="${escapeHtml(category)}"
            >
              ${escapeHtml(category)}
            </button>
          `;
        })
        .join("");

      document.querySelectorAll(".filter-btn").forEach(function (button) {
        button.addEventListener("click", function () {
          applyFilter(button.dataset.category);
        });
      });
    }

    function renderPlaceList() {
      const visiblePlaces = places.filter(function (place) {
        return activeCategory === "전체" || place.category === activeCategory;
      });

      const categories =
        activeCategory === "전체" ? getCategories() : [activeCategory];

      if (visiblePlaces.length === 0) {
        placeList.innerHTML =
          '<div class="empty-message">표시할 장소가 없습니다.</div>';
        return;
      }

      placeList.innerHTML = categories
        .map(function (category) {
          const categoryPlaces = visiblePlaces.filter(function (place) {
            return place.category === category;
          });

          if (categoryPlaces.length === 0) {
            return "";
          }

          return `
            <section class="place-group">
              <div class="group-title">${escapeHtml(category)}</div>
              ${categoryPlaces
                .map(function (place) {
                  return `
                    <button
                      type="button"
                      class="place-card"
                      data-place-id="${place.id}"
                    >
                      <span class="place-name">${escapeHtml(place.name)}</span>
                      <span class="place-description">
                        ${escapeHtml(place.description)}
                      </span>
                    </button>
                  `;
                })
                .join("")}
            </section>
          `;
        })
        .join("");

      document.querySelectorAll(".place-card").forEach(function (card) {
        card.addEventListener("click", function () {
          const place = places.find(function (item) {
            return item.id === Number(card.dataset.placeId);
          });

          if (place) {
            openPlace(place);
          }
        });
      });
    }

    function applyMarkerVisibility() {
      markers.forEach(function (marker, placeId) {
        const place = places.find(function (item) {
          return item.id === placeId;
        });

        if (!place) {
          return;
        }

        marker.setVisible(
          activeCategory === "전체" || place.category === activeCategory
        );
      });
    }

    function applyFilter(category) {
      activeCategory = category;

      renderFilters();
      applyMarkerVisibility();

      if (infoWindow) {
        infoWindow.close();
      }

      renderPlaceList();
    }

    function fitMapToPlaces() {
      if (!map || places.length === 0) {
        return;
      }

      const bounds = new google.maps.LatLngBounds();

      places.forEach(function (place) {
        bounds.extend({
          lat: place.lat,
          lng: place.lng
        });
      });

      if (places.length === 1) {
        map.setCenter({
          lat: places[0].lat,
          lng: places[0].lng
        });
        map.setZoom(14);
        return;
      }

      map.fitBounds(bounds, 50);
    }

    async function loadPlacesFromSheet() {
      try {
        const response = await fetch(getSheetDataUrl());

        if (!response.ok) {
          throw new Error("Google Sheets 데이터를 불러오지 못했습니다.");
        }

        const text = await response.text();
        const jsonText = text.substring(
          text.indexOf("{"),
          text.lastIndexOf("}") + 1
        );

        const data = JSON.parse(jsonText);
        const columns = data.table.cols.map(function (column) {
          return String(column.label || "").trim().toLowerCase();
        });

        const requiredColumns = ["name", "category", "map_url", "description"];
        const missingColumns = requiredColumns.filter(function (column) {
          return !columns.includes(column);
        });

        if (missingColumns.length > 0) {
          throw new Error(
            "시트에 필요한 열이 없습니다: " + missingColumns.join(", ")
          );
        }

        const rows = data.table.rows || [];
        const invalidPlaceNames = [];

        places = rows
          .map(function (row, index) {
            const values = {};

            columns.forEach(function (columnName, columnIndex) {
              values[columnName] = getCellValue(row.c[columnIndex]);
            });

            const name = String(values.name || "").trim();
            const category = String(values.category || "").trim();
            const mapUrl = String(values.map_url || "").trim();
            const description = String(values.description || "").trim();

            if (!name || !category || !mapUrl) {
              return null;
            }

            const coordinates = extractCoordinates(mapUrl);

            if (!coordinates) {
              invalidPlaceNames.push(name);
              return null;
            }

            return {
              id: index + 1,
              name: name,
              category: category,
              mapUrl: mapUrl,
              description: description,
              lat: coordinates.lat,
              lng: coordinates.lng
            };
          })
          .filter(Boolean);

        createMarkers();
        renderFilters();
        renderPlaceList();
        fitMapToPlaces();

        if (invalidPlaceNames.length > 0) {
          showError(
            "좌표를 찾지 못한 장소는 제외되었습니다: " +
              invalidPlaceNames.join(", ") +
              " — map_url에 !3d위도!4d경도 형식의 Google Maps URL을 넣어주세요."
          );
        }

        if (places.length === 0) {
          placeList.innerHTML =
            '<div class="empty-message">표시할 수 있는 장소가 없습니다.<br>map_url에 좌표가 포함된 Google Maps 링크를 넣어주세요.</div>';
        }
      } catch (error) {
        console.error("Google Sheets 로딩 오류:", error);
        placeList.innerHTML =
          '<div class="empty-message">장소 데이터를 불러오지 못했습니다.</div>';
        showError(error.message || "Google Sheets 데이터를 불러오는 중 오류가 발생했습니다.");
      }
    }

    sidebarToggle.addEventListener("click", function () {
      const isCollapsed = app.classList.toggle("sidebar-collapsed");

      sidebarToggle.textContent = isCollapsed ? "▶" : "◀";
      sidebarToggle.setAttribute(
        "aria-label",
        isCollapsed ? "장소 목록 펼치기" : "장소 목록 접기"
      );
      sidebarToggle.setAttribute(
        "title",
        isCollapsed ? "장소 목록 펼치기" : "장소 목록 접기"
      );
      sidebarToggle.setAttribute("aria-expanded", String(!isCollapsed));

      window.setTimeout(function () {
        if (map && window.google && google.maps) {
          google.maps.event.trigger(map, "resize");
        }
      }, 280);
    });

    window.initMap = function () {
      if (map) {
        return;
      }

      try {
        map = new google.maps.Map(document.getElementById("map"), {
          center: {
            lat: 33.3617,
            lng: 126.5292
          },
          zoom: 10,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: true
        });

        infoWindow = new google.maps.InfoWindow();
        loadPlacesFromSheet();
      } catch (error) {
        console.error("Google Maps 초기화 오류:", error);
        showError("Google 지도를 불러오는 중 오류가 발생했습니다.");
      }
    };

    window.gm_authFailure = function () {
      showError("Google Maps API 인증에 실패했습니다.");
    };

    if (!API_KEY.trim()) {
      showError("Google Maps API 키가 비어 있습니다.");
    } else {
      const googleMapsScript = document.createElement("script");

      googleMapsScript.src =
        "https://maps.googleapis.com/maps/api/js" +
        "?key=" +
        encodeURIComponent(API_KEY) +
        "&callback=initMap" +
        "&loading=async";

      googleMapsScript.async = true;

      googleMapsScript.onerror = function () {
        showError("Google Maps API를 불러오지 못했습니다.");
      };

      document.head.appendChild(googleMapsScript);
    }
  </script>
</body>
</html>
